name: export-onnx
on:
  workflow_dispatch:
  push:
    paths:
      - export_onnx.py
      - push_hf.py
      - requirements-export.txt
      - .github/workflows/export-onnx.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-export.txt
      - name: Install deps (CPU torch)
        run: pip install -r requirements-export.txt
      - name: Export ONNX
        run: python export_onnx.py --check
      - name: Validate
        run: |
          ls -lh models vocab.json
          python -c "import onnx; [onnx.load(f'models/{n}.onnx') for n in ('text_stage','sound_stage','decoder')]; print('onnx ok')"
      - name: Push models to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: fr0stb1rd/ema-lightning-web-onnx
        run: python push_hf.py
      - name: Commit vocab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vocab.json
          git diff --cached --quiet || git commit -m "vocab (actions)"
          git push
