name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [export-onnx]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # GITHUB_TOKEN ile yapilan push yeni run tetiklemez; export'un
    # commitledigi dosyalar ancak bu workflow_run tetikleyicisiyle yayinlanir.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - uses: actions/deploy-pages@v5
